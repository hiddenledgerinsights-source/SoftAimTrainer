name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoftAimTrainer-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip SoftAimTrainer-source.zip -d source

      - name: Fix Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source/SoftAimTrainer")
          kt = root / "app/src/main/java/com/example/softaimtrainer/MainActivity.kt"

          code = kt.read_text()
          code = code.replace(
              "setContentView(TrainerView())",
              "setContentView(TrainerView(this))"
          )
          kt.write_text(code)

          gradle_file = root / "app/build.gradle.kts"
          gradle_file.write_text("""
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.softaimtrainer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.softaimtrainer"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """.strip() + "\n")

          print("Android project fixes applied.")
          PY

      - name: Build APK
        run: |
          cd source/SoftAimTrainer
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoftAimTrainer-APK
          path: source/SoftAimTrainer/app/build/outputs/apk/debug/app-debug.apk
