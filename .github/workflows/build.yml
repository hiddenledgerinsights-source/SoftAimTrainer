name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoftAimTrainer-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip SoftAimTrainer-source.zip -d source

      - name: Fix Java and Kotlin versions
        run: |
          cat > source/SoftAimTrainer/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.softaimtrainer"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.softaimtrainer"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: |
          cd source/SoftAimTrainer
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoftAimTrainer-APK
          path: source/SoftAimTrainer/app/build/outputs/apk/debug/app-debug.apk
